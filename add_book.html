{% extends "base.html" %}
{% block title %}Add Book - Library Management System{% endblock %}

{% block content %}
<h2 class="mb-4">Add New Book</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Author *</label>
                    <input type="text" name="author" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ISBN *</label>
                    <input type="text" name="isbn" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control" placeholder="e.g. Fiction, Science">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Quantity *</label>
                    <input type="number" name="quantity" class="form-control" value="1" min="1" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Published Year</label>
                    <input type="number" name="published_year" class="form-control" placeholder="2020">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save Book</button>
                <a href="{{ url_for('books') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
